name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TUCheat/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained EXE
        run: dotnet publish TUCheat/TUCheat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUCheat-Windows-x64
          path: dist/TUCheat.exe
          if-no-files-found: error
